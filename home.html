<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROBLOX</title>
  <link rel="stylesheet" href="./style.css">
  <!-- Verifica a conta ANTES de carregar a página -->
  <script src="./auth.js"></script>
  <script>Auth.requireLogin("index.html");</script>
</head>
<body>

  <!-- Topbar azul -->
  <div id="roblox-topbar">
    <img src="images/roblox-logo-white.png" alt="ROBLOX" id="topbar-logo">
    <nav>
      <a href="#">Home</a>
      <a href="#">Games</a>
      <a href="#">Catalog</a>
      <a href="#">Develop</a>
      <a href="#">Forum</a>
    </nav>
    <div id="topbar-search-container">
      <input type="text" placeholder="Search" id="topbar-search">
    </div>
  </div>

  <!-- Left Sidebar -->
  <aside id="left-sidebar">
    <div class="comic-strip">
      <p><strong>Howling</strong></p>
      <p>Screaming to the moon</p>
      <p>Saying hello to the big glowing circle on the skies.</p>
    </div>
  </aside>

  <!-- Right Sidebar -->
  <aside id="right-sidebar">
    <div class="ad-banner">
      <p><strong>PROTECT THE GALAXY</strong></p>
      <img src="images/lightsaber-ad.jpg" alt="Ad">
    </div>
  </aside>

  <!-- Top Navigation Bar -->
  <header id="top-bar">
    <img src="images/roblox-logo.png" alt="ROBLOX" id="logo">
    <nav>
      <a href="#">Home</a>
      <a href="#">Profile</a>
      <a href="#">Messages <span class="counter" id="msg-count">3</span></a>
      <a href="#">Friends <span class="counter" id="friend-count">199</span></a>
      <a href="#">Settings</a>
      <a href="#" id="logout">Sair</a>
    </nav>
  </header>

  <!-- Main Content -->
  <main id="main-content">
    <h1 id="hello">Hello!</h1>

    <section>
      <h2>Friends (199)</h2>
      <div class="friend-grid">
        <div class="friend">
          <img src="images/avatar1.png" alt="Invinciblecl...">
          <span>Invinciblecl...</span>
        </div>
      </div>
    </section>

    <section>
      <h2>Recently Played</h2>
      <div class="game-grid">
        <div class="game-card">
          <a href="games/meepcity/index.html">
            <img src="images/meepcity.jpg" alt="MeepCity">
            <p>MeepCity</p>
            <span>10,467 Playing</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
  <script>
    // Mostra o nome da conta logada
    document.getElementById("hello").textContent = "Hello, " + Auth.currentUser() + "!";
    document.getElementById("logout").onclick = (e) => { e.preventDefault(); Auth.logout(); };
  </script>
</body>
</html>
